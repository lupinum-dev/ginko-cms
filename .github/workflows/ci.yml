name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GINKO_COREPACK_VERSION: '0.34.5'
  GINKO_NODE_VERSION: '24.18.0'

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ginko-cms

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: ginko-cms
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.GINKO_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned package-manager launcher
        run: npm install --global corepack@"$GINKO_COREPACK_VERSION" && corepack enable

      - name: Install frozen standalone workspace
        run: pnpm install --frozen-lockfile

      - name: Refactor reliability proof
        run: pnpm run verify:refactor

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: refactor-proof-${{ github.sha }}
          path: ginko-cms/reports/refactor-proof
          if-no-files-found: error
          retention-days: 14

      - name: Production audit
        run: pnpm run audit:prod
