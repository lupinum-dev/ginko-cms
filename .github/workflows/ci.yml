name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ginko-cms

    steps:
      - uses: actions/checkout@v6
        with:
          path: ginko-cms

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install frozen standalone workspace
        run: pnpm install --frozen-lockfile

      - name: Refactor reliability proof
        run: pnpm run verify:refactor

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: refactor-proof-${{ github.sha }}
          path: ginko-cms/reports/refactor-proof
          if-no-files-found: error
          retention-days: 14

      - name: Production audit
        run: pnpm run audit:prod

  package-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ginko-cms

    steps:
      - uses: actions/checkout@v6
        with:
          path: ginko-cms

      - name: Read immutable compatibility commits
        id: compatibility
        run: node -e "const fs=require('node:fs');const c=require('./packages/cms/compatibility.json');fs.appendFileSync(process.env.GITHUB_OUTPUT, 'content_commit='+c.releaseArtifacts['@lupinum/ginko-content'].sourceCommit+'\ncontent_version='+c.releaseStack['@lupinum/ginko-content']+'\nbetter_convex_nuxt_commit='+c.releaseArtifacts['better-convex-nuxt'].sourceCommit+'\nbetter_convex_nuxt_version='+c.releaseStack['better-convex-nuxt']+'\n')"

      - uses: actions/checkout@v6
        with:
          repository: lupinum-dev/ginko-content
          path: ginko-content
          ref: ${{ steps.compatibility.outputs.content_commit }}
          token: ${{ secrets.LUPINUM_CI_REPO_READ_TOKEN || github.token }}

      - uses: actions/checkout@v6
        with:
          repository: lupinum-dev/better-convex-nuxt
          path: better-convex-nuxt
          ref: ${{ steps.compatibility.outputs.better_convex_nuxt_commit }}
          token: ${{ secrets.LUPINUM_CI_REPO_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Pack immutable Ginko Content
        working-directory: ginko-content
        run: |
          pnpm install --frozen-lockfile
          pnpm run release:pack

      - name: Pack immutable Better Convex Nuxt
        run: |
          corepack pnpm@10.30.3 --dir ../better-convex-nuxt install --frozen-lockfile
          mkdir -p .pack/upstream
          corepack pnpm@10.30.3 --dir ../better-convex-nuxt pack --pack-destination "$PWD/.pack/upstream"

      - name: Install frozen CMS workspace
        run: pnpm install --frozen-lockfile

      - name: Build deterministic candidate
        run: pnpm run candidate:pack
        env:
          GINKO_CONTENT_ROOT: ${{ github.workspace }}/ginko-content
          GINKO_CONTENT_TARBALL: ${{ github.workspace }}/ginko-content/.pack/lupinum-ginko-content-${{ steps.compatibility.outputs.content_version }}.tgz
          BETTER_CONVEX_NUXT_ROOT: ${{ github.workspace }}/better-convex-nuxt
          BETTER_CONVEX_NUXT_TARBALL: ${{ github.workspace }}/ginko-cms/.pack/upstream/better-convex-nuxt-${{ steps.compatibility.outputs.better_convex_nuxt_version }}.tgz

      - name: Verify exact pnpm and npm consumers
        run: pnpm run release:verify:candidate
        env:
          GINKO_CONTENT_TARBALL: ${{ github.workspace }}/ginko-content/.pack/lupinum-ginko-content-${{ steps.compatibility.outputs.content_version }}.tgz
          BETTER_CONVEX_NUXT_TARBALL: ${{ github.workspace }}/ginko-cms/.pack/upstream/better-convex-nuxt-${{ steps.compatibility.outputs.better_convex_nuxt_version }}.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-tuple
          path: ginko-cms/.pack/candidate
          if-no-files-found: error
          retention-days: 1

  live-release-smoke:
    runs-on: ubuntu-latest
    needs: package-smoke
    if: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ginko-cms

    steps:
      - uses: actions/checkout@v6
        with:
          path: ginko-cms

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install frozen CMS workspace
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: exact-candidate-tuple
          path: ginko-cms/.pack/candidate

      - name: Live packed Convex package E2E
        run: |
          content_tarball="$(find "$PWD/.pack/candidate" -maxdepth 1 -name 'lupinum-ginko-content-*.tgz' -print -quit)"
          better_convex_nuxt_tarball="$(find "$PWD/.pack/candidate" -maxdepth 1 -name 'better-convex-nuxt-*.tgz' -print -quit)"
          test -n "$content_tarball"
          test -n "$better_convex_nuxt_tarball"
          GINKO_CONTENT_TARBALL="$content_tarball" BETTER_CONVEX_NUXT_TARBALL="$better_convex_nuxt_tarball" pnpm run package:e2e:live
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
