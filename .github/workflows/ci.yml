name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GINKO_COREPACK_VERSION: '0.34.5'
  GINKO_NODE_VERSION: '24.18.0'

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ginko-cms

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: ginko-cms
          persist-credentials: false

      - name: Resolve the exact Better Convex rehearsal source
        id: better_convex
        working-directory: ginko-cms
        run: |
          node -e "const matrix=require('./packages/cms/compatibility.json'); for (const [key,name] of [['commit','better-convex-nuxt'],['nuxt_version','better-convex-nuxt'],['vue_version','better-convex-vue'],['mcp_version','better-convex-mcp']]) process.stdout.write(key+'='+(key==='commit' ? matrix.sourceRehearsal.betterConvexCommit : matrix.releaseStack[name])+'\n')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: lupinum-dev/better-convex-nuxt
          ref: ${{ steps.better_convex.outputs.commit }}
          path: better-convex-nuxt
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.GINKO_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned package-manager launcher
        run: npm install --global corepack@"$GINKO_COREPACK_VERSION" && corepack enable

      - name: Install the frozen Ginko dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install the frozen Better Convex source graph
        working-directory: better-convex-nuxt
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Playwright browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Repository check
        run: pnpm --config.verify-deps-before-run=warn run check

      - name: Current-source packed consumer
        env:
          BETTER_CONVEX_NUXT_PACKAGE_ROOT: ${{ github.workspace }}/better-convex-nuxt
        run: pnpm --config.verify-deps-before-run=warn run package:e2e:dev

      - name: Production audit
        run: pnpm --config.verify-deps-before-run=warn run audit:prod
