packages:
  - '../ginko-content/packages/*'
  - '../trellis'
  - '../trellis/packages/*'
  - 'packages/*'
  - 'playground'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@lupinum/ginko-content'
  - '@lupinum/trellis'
  - '@lupinum/trellis-bridge'
  - '@nuxt/*'
  - nuxt
overrides:
  # Release audit overrides. These affect local workspace resolution only; packed
  # package manifests must not ship override policy. Remove a line when
  # `pnpm why <name>` shows all upstream owners resolve the patched version
  # without help and `pnpm audit --prod --audit-level low` stays green.
  brace-expansion: 5.0.6
  convex: 1.38.0
  devalue: 5.8.1
  fast-uri: 3.1.2
  fast-xml-builder: 1.1.7
  '@lupinum/ginko-content': file:../ginko-content/.pack/lupinum-ginko-content-0.1.2.tgz
  h3: 1.15.11
  hono: 4.12.18
  ip-address: 10.1.1
  kysely: 0.28.17
  mermaid: 11.15.0
  nitropack: 2.13.4
  postcss: 8.5.10
  qs: 6.15.2
  simple-git: 3.36.0
  ws: 8.20.1
auditConfig:
  # `elliptic` is pulled through @lupinum/trellis -> @nuxtjs/mcp-toolkit ->
  # secure-exec -> node-stdlib-browser and npm reports no patched version.
  # Remove this when the upstream chain stops resolving elliptic or npm lists a
  # fixable version.
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84
approveBuilds: esbuild,@parcel/watcher,unrs-resolver
