packages:
  - 'packages/*'
  - 'playground'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@lupinum/ginko-content'
  - '@nuxt/*'
  - better-convex-nuxt
  - nuxt
allowBuilds:
  '@parcel/watcher': true
  '@lupinum/ginko-content@https://codeload.github.com/lupinum-dev/ginko-content/tar.gz/fd7e8fda6e60c61244424941c4811c09d626be6f#path:/packages/content': true
  better-sqlite3: true
  better-convex-nuxt@https://codeload.github.com/lupinum-dev/better-convex-nuxt/tar.gz/8cc1a16b654388d23c88c71347336852ecb6031b: true
  cbor-extract: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # Release audit overrides. These affect local workspace resolution only; packed
  # package manifests must not ship override policy. Remove a line when
  # `pnpm why <name>` shows all upstream owners resolve the patched version
  # without help and `pnpm audit --prod --audit-level low` stays green.
  '@babel/core': 7.29.6
  '@vitest/browser': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  # Remove after 0.3.0-rc.5 is published. Package manifests require RC5 while
  # the workspace pins the reviewed clean source commit for reproducibility.
  '@lupinum/ginko-content': 'github:lupinum-dev/ginko-content#fd7e8fda6e60c61244424941c4811c09d626be6f&path:/packages/content'
  # Remove after 0.7.0-beta.0 is published. Package manifests keep the release
  # semver; the workspace pins the reviewed upstream commit for reproducibility.
  better-convex-nuxt: github:lupinum-dev/better-convex-nuxt#8cc1a16b654388d23c88c71347336852ecb6031b
  brace-expansion: 5.0.6
  convex: 1.42.2
  devalue: 5.8.1
  esbuild: 0.28.1
  fast-uri: 3.1.2
  fast-xml-builder: 1.1.7
  h3: 1.15.11
  hono: 4.12.25
  ip-address: 10.1.1
  js-yaml: 4.2.0
  kysely: 0.28.17
  launch-editor: 2.14.1
  linkify-it: 5.0.1
  mermaid: 11.15.0
  nitropack: 2.13.4
  postcss: 8.5.10
  qs: 6.15.2
  shell-quote: 1.8.4
  simple-git: 3.36.0
  tar: 7.5.16
  undici: 7.28.0
  typescript: 5.9.3
  vite: 7.3.6
  vitest: 4.1.10
  vue: 3.5.39
  ws: 8.21.0
auditConfig:
  # `elliptic` is pulled through @nuxtjs/mcp-toolkit -> secure-exec ->
  # node-stdlib-browser and npm reports no patched version.
  # Remove this when the upstream chain stops resolving elliptic or npm lists a
  # fixable version.
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84
