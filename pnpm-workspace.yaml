packages:
  - '../ginko-content/packages/*'
  - 'packages/*'
  - 'playground'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@lupinum/ginko-content'
  - '@nuxt/*'
  - better-convex-nuxt
  - nuxt
overrides:
  # Release audit overrides. These affect local workspace resolution only; packed
  # package manifests must not ship override policy. Remove a line when
  # `pnpm why <name>` shows all upstream owners resolve the patched version
  # without help and `pnpm audit --prod --audit-level low` stays green.
  '@babel/core': 7.29.6
  '@vitest/browser': 4.1.8
  '@vitest/browser-playwright': 4.1.8
  brace-expansion: 5.0.6
  convex: 1.38.0
  devalue: 5.8.1
  esbuild: 0.28.1
  fast-uri: 3.1.2
  fast-xml-builder: 1.1.7
  h3: 1.15.11
  hono: 4.12.25
  ip-address: 10.1.1
  js-yaml: 4.2.0
  kysely: 0.28.17
  launch-editor: 2.14.1
  linkify-it: 5.0.1
  mermaid: 11.15.0
  nitropack: 2.13.4
  postcss: 8.5.10
  qs: 6.15.2
  shell-quote: 1.8.4
  simple-git: 3.36.0
  tar: 7.5.16
  undici: 7.28.0
  vite: 7.3.5
  vitest: 4.1.8
  ws: 8.21.0
auditConfig:
  # `elliptic` is pulled through @nuxtjs/mcp-toolkit -> secure-exec ->
  # node-stdlib-browser and npm reports no patched version.
  # Remove this when the upstream chain stops resolving elliptic or npm lists a
  # fixable version.
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84
approveBuilds: esbuild,@parcel/watcher,unrs-resolver
allowBuilds:
  '@parcel/watcher': set this to true or false
  better-sqlite3: set this to true or false
  cbor-extract: set this to true or false
  esbuild: set this to true or false
  unrs-resolver: set this to true or false
  vue-demi: set this to true or false
