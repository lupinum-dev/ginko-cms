packages:
  - 'packages/*'
  - 'playground'
minimumReleaseAge: 1440
strictPeerDependencies: true
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
overrides:
  '@lupinum/ginko-content': 'file:.pack/upstream/lupinum-ginko-content-1.0.0-beta.9.tgz'
  '@lupinum/ginko-editor': 'file:.pack/upstream/lupinum-ginko-editor-0.1.0.tgz'
