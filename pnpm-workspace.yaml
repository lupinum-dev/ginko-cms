packages:
  - 'packages/*'
  - 'playground'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@better-convex/mcp'
  - '@lupinum/ginko-content'
  - '@modelcontextprotocol/core'
  - '@modelcontextprotocol/server'
  - '@nuxt/*'
  - better-convex-nuxt
  - better-convex-vue
  - nuxt
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # Release audit overrides. These affect local workspace resolution only; packed
  # package manifests must not ship override policy. Remove a line when
  # `pnpm why <name>` shows all upstream owners resolve the patched version
  # without help and `pnpm audit --prod --audit-level low` stays green.
  '@babel/core': 7.29.6
  '@hono/node-server': 2.0.10
  '@vitest/browser': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  body-parser: 2.3.0
  brace-expansion: 5.0.8
  convex: 1.42.2
  devalue: 5.8.1
  esbuild: 0.28.1
  fast-uri: 3.1.4
  fast-xml-builder: 1.1.7
  h3: 1.15.11
  hono: 4.12.27
  ip-address: 10.1.1
  js-yaml: 4.3.0
  kysely: 0.28.17
  launch-editor: 2.14.1
  linkify-it: 5.0.2
  mermaid: 11.15.0
  nitropack: 2.13.4
  oxc-parser: 0.140.0
  postcss: 8.5.18
  qs: 6.15.2
  shell-quote: 1.10.0
  simple-git: 3.36.0
  svgo: 4.0.2
  tar: 7.5.21
  undici: 7.28.0
  typescript: 5.9.3
  vitest: 4.1.10
  vue-sfc-transformer: 0.1.17
  ws: 8.21.0
